services:
  postgres:
    image: postgres:17-alpine
    container_name: reven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reven}
      POSTGRES_USER: ${POSTGRES_USER:-reven_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REVEN_APP_USER: ${REVEN_APP_USER:-reven_app}
      REVEN_APP_PASSWORD: ${REVEN_APP_PASSWORD:?Set REVEN_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reven_postgres_data:/var/lib/postgresql/data
      - ./database/init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reven_admin} -d ${POSTGRES_DB:-reven}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  reven_postgres_data:
